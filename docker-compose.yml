version: '3.8'
services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-gateway
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - NODE_ENV=production
    volumes:
      - omniroute-data:/app/data
      - ./docker-compose.yml:/etc/docker-compose.yml

volumes:
  omniroute-data:
